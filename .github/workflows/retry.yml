name: oci-vm-retry

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-vm-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -q oci

      - name: Tentar criar a VM
        id: run
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBKEY: ${{ secrets.SSH_PUBKEY }}
          BUDGET_SECONDS: "20400"
        run: python retry.py

      - name: Desativar workflow
        if: steps.run.outputs.disable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable retry.yml -R "$GITHUB_REPOSITORY"

      - name: Encadear proxima execucao
        if: steps.run.outputs.chain == 'true' && steps.run.outputs.disable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
